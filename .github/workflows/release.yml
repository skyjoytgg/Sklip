# Publie une nouvelle version de Sklip quand on pousse un tag « v0.2.0 », « v0.3.0 »…
# Les PC des streamers voient la mise à jour au lancement suivant (electron-updater).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

# Une seule construction à la fois par version (évite deux releases « v0.1.0 » comme le 26/11).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: FFmpeg (version « essentials » de gyan.dev)
        shell: pwsh
        run: |
          Invoke-WebRequest https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-tmp
          New-Item -ItemType Directory -Force vendor/ffmpeg | Out-Null
          Get-ChildItem ffmpeg-tmp -Recurse -Include ffmpeg.exe,ffprobe.exe | Copy-Item -Destination vendor/ffmpeg
          "$PWD\vendor\ffmpeg" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Tests du moteur
        working-directory: engine
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt
          # En cas d'échec, les tests en erreur sont aussi affichés en « annotations » (visibles sans se connecter).
          python -m pytest -q -rfE --tb=line 2>&1 | Tee-Object -FilePath pytest.txt
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Get-Content pytest.txt | Select-String -Pattern '^(FAILED|ERROR)|Error:|error:|assert' |
              Select-Object -First 20 | ForEach-Object { Write-Output "::error::$($_.Line)" }
            exit $code
          }

      - name: Construction du moteur (PyInstaller)
        working-directory: engine
        run: .\build.bat
        shell: cmd

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Tests de l'appli
        working-directory: app
        run: |
          npm install
          npm test

      # electron-builder envoie l'installeur, le blockmap et latest.yml en parallèle : si la release n'existe pas
      # encore, chacun la crée et on obtient deux releases du même tag (v0.1.0 et v0.1.1, 26/11), dont une sans
      # latest.yml qui casse la mise à jour automatique. On crée donc UNE release brouillon avant, et on la
      # publie à la fin, une fois tous les fichiers envoyés.
      - name: Release brouillon (une seule)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          v=$(node -p "require('./app/package.json').version")
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then echo "::error::Le tag $GITHUB_REF_NAME ne correspond pas à la version de app/package.json ($v)"; exit 1; fi
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" --notes "Sklip $GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"

      - name: Installeur
        working-directory: app
        env:
          SKLIP_TWITCH_CLIENT_ID: ${{ vars.SKLIP_TWITCH_CLIENT_ID }}
          SKLIP_RELAY_URL: ${{ vars.SKLIP_RELAY_URL }}
        run: npm run release

      # Envoi par gh dans LA release créée plus haut (v0.1.9 : electron-builder, qui cherchait la release lui-même,
      # ne l'a pas trouvée tout de suite et a tout mis dans un autre brouillon → release publiée sans fichiers).
      - name: Envoi des fichiers dans la release
        working-directory: app/dist
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          gh release upload "$GITHUB_REF_NAME" latest.yml "Sklip-Setup-$v.exe" "Sklip-Setup-$v.exe.blockmap" --clobber --repo "$GITHUB_REPOSITORY"
          n=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets | length' --repo "$GITHUB_REPOSITORY")
          if [ "$n" -lt 3 ]; then echo "::error::Release sans ses fichiers ($n)"; exit 1; fi

      - name: Publication de la release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --draft=false --latest --repo "${{ github.repository }}"
