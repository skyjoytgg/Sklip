# Publie une nouvelle version de Sklip quand on pousse un tag « v0.2.0 », « v0.3.0 »…
# Les PC des streamers voient la mise à jour au lancement suivant (electron-updater).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: FFmpeg (version « essentials » de gyan.dev)
        shell: pwsh
        run: |
          Invoke-WebRequest https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-tmp
          New-Item -ItemType Directory -Force vendor/ffmpeg | Out-Null
          Get-ChildItem ffmpeg-tmp -Recurse -Include ffmpeg.exe,ffprobe.exe | Copy-Item -Destination vendor/ffmpeg
          "$PWD\vendor\ffmpeg" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Tests du moteur
        working-directory: engine
        run: |
          python -m pip install -r requirements.txt
          python -m pytest -q

      - name: Construction du moteur (PyInstaller)
        working-directory: engine
        run: .\build.bat
        shell: cmd

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Tests de l'appli
        working-directory: app
        run: |
          npm install
          npm test

      - name: Installeur + publication sur GitHub Releases
        working-directory: app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SKLIP_TWITCH_CLIENT_ID: ${{ vars.SKLIP_TWITCH_CLIENT_ID }}
          SKLIP_RELAY_URL: ${{ vars.SKLIP_RELAY_URL }}
        run: npm run release
